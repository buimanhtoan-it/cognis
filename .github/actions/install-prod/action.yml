name: Install cognis (production extras)
description: Editable install with all runtime extras used in production/CI.

runs:
  using: composite
  steps:
    - name: Install package and extras
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[indexer,embed-local,vector,tokenizers,mcp]"
    - name: Install dev tools
      shell: bash
      run: |
        python -m pip install --group dev 2>/dev/null || \
          python -m pip install ruff mypy pytest pytest-asyncio pytest-benchmark hypothesis pre-commit invoke build twine
