name: nightly-benchmark

# Runs latency benchmark tests on a schedule and uploads stats.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  benchmark:
    name: latency benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install cognis (production extras)
        uses: ./.github/actions/install-prod

      - name: Run benchmark tests
        run: |
          python -m pytest tests/benchmark/test_latency.py \
            -m benchmark \
            --benchmark-only \
            --benchmark-json=benchmark-reports/results.json \
            -v

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmark-reports/
          if-no-files-found: ignore

      - name: Append summary
        if: always()
        run: |
          {
            echo "# Nightly benchmarks"
            echo
            echo "See artifact \`benchmark-reports/results.json\` for p50/p95 stats."
            echo "Design budgets are documented in \`docs/performance.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
