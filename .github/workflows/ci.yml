name: ci-lint-unit

# Fast feedback on every push: ruff + mypy (strict on packages/core) + unit
# + property-based tests. The cross-platform integration suite lives in
# `pr-integration.yml` so push CI stays under a few minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint-and-unit:
    name: lint + unit (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Cache tree-sitter grammars and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree_sitter
            ~/.cache/tree-sitter
            ./build-tree-sitter
            ./tree_sitter_languages_build
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install production + dev dependencies
        uses: ./.github/actions/install-prod

      - name: Lint (ruff format + check)
        run: make lint

      - name: Version consistency (no drift across version files)
        run: python scripts/bump_version.py --check

      - name: Typecheck (mypy strict on packages/core)
        run: make typecheck

      - name: Unit + PBT
        env:
          # Pin hypothesis seed in CI per cross-cutting checklist (tasks.md).
          HYPOTHESIS_PROFILE: ci
        run: make test PYTEST_ARGS="--maxfail=1"

  e2e-sandbox:
    name: e2e sandbox (cross-process CLI + indexd + mcpd)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Cache tree-sitter grammars and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree_sitter
            ~/.cache/tree-sitter
            ./build-tree-sitter
            ./tree_sitter_languages_build
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install production + dev dependencies
        uses: ./.github/actions/install-prod

      - name: Install wheel-build tooling (for the packaging e2e)
        run: python -m pip install build hatchling

      - name: E2E sandbox (real process boundaries)
        env:
          HYPOTHESIS_PROFILE: ci
          # Semantic warm-up needs the model; the semantic e2e tests skip
          # cleanly without it (no model download in push CI).
          COGNIS_MCP_WARM_SEMANTIC_ON_STARTUP: "0"
        run: python -m pytest -m e2e --maxfail=3 -v

  vscode-extension:
    name: vscode extension (compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/cognis-vscode/package.json

      - name: Install and compile extension
        working-directory: apps/cognis-vscode
        run: |
          npm ci 2>/dev/null || npm install
          npm run compile
          npm run lint

      - name: Extension unit + contract-parity tests
        working-directory: apps/cognis-vscode
        run: npm test

  vscode-host-e2e:
    name: vscode host e2e (real editor + real backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Cache tree-sitter grammars and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree_sitter
            ~/.cache/tree-sitter
            ./build-tree-sitter
            ./tree_sitter_languages_build
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install production + dev dependencies (the real backend)
        uses: ./.github/actions/install-prod

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/cognis-vscode/package.json

      - name: Install and compile extension
        working-directory: apps/cognis-vscode
        run: |
          npm ci 2>/dev/null || npm install
          npm run compile

      - name: Full-stack host e2e (real VS Code + real backend, headless)
        working-directory: apps/cognis-vscode
        # Launches a real VS Code under xvfb, points cognis.pythonPath at the
        # backend installed above, runs cognis.setupWorkspace, and asserts the
        # real .cognis/ + mcp.json are written and the flow is traced.
        env:
          COGNIS_TEST_PYTHON: python
          COGNIS_MCP_WARM_SEMANTIC_ON_STARTUP: "0"
        run: xvfb-run -a npm run test:host
