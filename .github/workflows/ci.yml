name: ci

# Fast feedback on every push. The Python engine was removed at K8
# (rust-engine-migration Task 11.2): the Rust workspace is now built and tested
# by `rust.yml` (cargo build/test/clippy/fmt), and this workflow only compiles
# and tests the TypeScript VS Code extension (out of scope for the migration,
# but still shipped). There is no longer any Python lint/unit/e2e job here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vscode-extension:
    name: vscode extension (compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/cognis-vscode/package.json

      - name: Install and compile extension
        working-directory: apps/cognis-vscode
        run: |
          npm ci 2>/dev/null || npm install
          npm run compile
          npm run lint

      - name: Extension unit + contract-parity tests
        working-directory: apps/cognis-vscode
        run: npm test
