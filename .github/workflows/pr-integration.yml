name: pr-integration

# Cross-platform integration suite gated to PRs. Runs the same shape as ci.yml
# but adds macOS + Windows and the slower `integration` pytest mark.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  integration:
    name: integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Cache tree-sitter grammars and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree_sitter
            ~/.cache/tree-sitter
            ./build-tree-sitter
            ./tree_sitter_languages_build
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install production + dev dependencies
        uses: ./.github/actions/install-prod

      - name: Unit + integration tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          python -m pytest -m integration --maxfail=5 -v

  e2e:
    name: e2e cross-app flow (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Cache tree-sitter grammars and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tree_sitter
            ~/.cache/tree-sitter
            ./build-tree-sitter
            ./tree_sitter_languages_build
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install production + dev dependencies
        uses: ./.github/actions/install-prod

      - name: Full cross-app E2E (CLI + indexd + mcpd over real processes)
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          python -m pytest -m e2e --maxfail=3 -v

      - name: MCP conformance (required)
        run: python -m cognis.cli.main mcp-conformance
