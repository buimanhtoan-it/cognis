name: release

# Tag-driven release: build wheel/sdist, publish GHCR image, create GitHub Release.
# PyPI publish is optional — set PYPI_API_TOKEN repository secret to enable.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  PYTHONUNBUFFERED: "1"
  REGISTRY: ghcr.io
  # The GitHub repo is named "cognis", but the published artifact is
  # "cognis-engine" (the PyPI distribution name), so pin the image name
  # explicitly instead of deriving it from github.repository.
  IMAGE_NAME: ${{ github.repository_owner }}/cognis-engine

jobs:
  build-python:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build artifacts
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    name: build and push image
    runs-on: ubuntu-latest
    needs: build-python
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-python, docker]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi:
    name: PyPI publish (optional)
    runs-on: ubuntu-latest
    needs: build-python
    # NOTE: the `secrets` context is NOT available in a job-level `if`, so we
    # cannot gate the whole job on the token. Instead we expose it as an env var
    # (allowed at job level) and gate the publish step on that — the job runs
    # but the upload is skipped cleanly when the secret is unset.
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
        run: python -m pip install twine && twine upload dist/*

      - name: Skipped notice
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN secret not set — skipping PyPI publish."
