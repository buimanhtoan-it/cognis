name: release

# Tag-driven release. Since the Python engine was removed at K8
# (rust-engine-migration Task 11.2) this builds ONLY the pure-Rust single static
# `cognis` binary per platform (Task 10.1 / G2) — SQLite bundled, no system
# SQLite or Python required (Requirements 8.1, 8.2). The legacy Python
# wheel/sdist, the GHCR Python image, and the PyPI publish jobs are gone.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Per-platform single-binary distribution (Task 10.1). Each entry builds the
  # multi-call `cognis` binary in --release with SQLite bundled and the ONNX
  # embedder backend compiled in (`--features onnx-download`, so ONNX Runtime is
  # statically linked and the binary needs no system ORT), then stages it via
  # `cargo xtask dist` (binary + SHA-256 sidecar). Native runners cover the
  # host-architecture targets; the Linux aarch64 target cross-compiles with
  # `cross` (Docker-backed, no local toolchain).
  #
  # NOTE: the binary carries the embedder *code*; the bge-small model assets
  # (model.onnx / tokenizer.json / pooling.json) are provisioned separately into
  # COGNIS_ONNX_MODEL_DIR (or `assets/models/<leaf>` next to the binary). Without
  # the assets present the semantic leg degrades to empty (lexical + structural
  # still serve) — see docs/distribution.md.
  dist-binaries:
    name: dist · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build + stage (cross)
        if: ${{ matrix.cross }}
        run: cargo xtask dist --use-cross --target ${{ matrix.target }} --features onnx-download

      - name: Build + stage (native)
        if: ${{ !matrix.cross }}
        run: cargo xtask dist --target ${{ matrix.target }} --features onnx-download

      - uses: actions/upload-artifact@v4
        with:
          name: cognis-${{ matrix.target }}
          path: |
            dist/cognis-${{ matrix.target }}*

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [dist-binaries]
    steps:
      - uses: actions/checkout@v5

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: cognis-*
          path: binaries/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/*
          generate_release_notes: true
