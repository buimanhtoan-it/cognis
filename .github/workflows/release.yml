name: release

# Tag-driven release. Since the Python engine was removed at K8
# (rust-engine-migration Task 11.2) this builds ONLY the pure-Rust single static
# `cognis` binary per platform (Task 10.1 / G2) — SQLite bundled, no system
# SQLite or Python required (Requirements 8.1, 8.2). The legacy Python
# wheel/sdist, the GHCR Python image, and the PyPI publish jobs are gone.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Per-platform single-binary distribution (Task 10.1). Each entry builds the
  # multi-call `cognis` binary in --release with SQLite bundled and the ONNX
  # embedder backend compiled in (`--features onnx-download`, so ONNX Runtime is
  # statically linked and the binary needs no system ORT), then stages it via
  # `cargo xtask dist` (binary + SHA-256 sidecar). Native runners cover the
  # host-architecture targets; the Linux aarch64 target cross-compiles with
  # `cross` (Docker-backed, no local toolchain).
  #
  # NOTE: the binary carries the embedder *code*; the bge-small model assets
  # (model.onnx / tokenizer.json / pooling.json) are provisioned separately into
  # COGNIS_ONNX_MODEL_DIR (or `assets/models/<leaf>` next to the binary). Without
  # the assets present the semantic leg degrades to empty (lexical + structural
  # still serve) — see docs/distribution.md.
  dist-binaries:
    name: dist · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build + stage (cross)
        if: ${{ matrix.cross }}
        run: cargo xtask dist --use-cross --target ${{ matrix.target }} --features onnx-download

      - name: Build + stage (native)
        if: ${{ !matrix.cross }}
        run: cargo xtask dist --target ${{ matrix.target }} --features onnx-download

      - uses: actions/upload-artifact@v4
        with:
          name: cognis-${{ matrix.target }}
          path: |
            dist/cognis-${{ matrix.target }}*

  # Semantic-model provisioning (Option B, end-to-end automation). The extension
  # downloads the bge-small model assets from THIS release on first semantic use
  # (see apps/cognis-vscode/src/model.ts): model.onnx + tokenizer.json +
  # pooling.json, each checksum-verified against a `.sha256` sidecar. Without
  # these assets a fresh buyer's semantic search silently stays off, so we attach
  # them to every release automatically — no manual upload.
  #
  # Source: the community ONNX export `Xenova/bge-small-en-v1.5` (a BertModel
  # feature-extraction graph: inputs input_ids/attention_mask/token_type_ids,
  # output last_hidden_state[batch,seq,384] — exactly what the onnx-local backend
  # in crates/cognis-embed/src/onnx.rs consumes). Pinned to a specific commit for
  # reproducibility; the sidecars are generated from the bytes we actually
  # download, so verification is self-consistent per release. pooling.json encodes
  # bge's real policy (CLS pooling + L2 normalise).
  provision-model:
    name: provision · semantic model
    runs-on: ubuntu-latest
    env:
      HF_REPO: Xenova/bge-small-en-v1.5
      HF_REV: ea104dacec62c0de699686887e3f920caeb4f3e3
      MODEL_ID: bge-small-en-v1.5
    steps:
      - name: Download + stage model assets
        run: |
          set -euo pipefail
          base="https://huggingface.co/${HF_REPO}/resolve/${HF_REV}"
          mkdir -p model
          echo "[model] downloading model.onnx"
          curl --fail --location --retry 3 --retry-delay 5 \
            -o "model/${MODEL_ID}-model.onnx" "${base}/onnx/model.onnx"
          echo "[model] downloading tokenizer.json"
          curl --fail --location --retry 3 --retry-delay 5 \
            -o "model/${MODEL_ID}-tokenizer.json" "${base}/tokenizer.json"
          echo "[model] writing pooling.json (bge: CLS pooling + L2 normalise)"
          printf '{"pooling":"cls","normalize":true}\n' > "model/${MODEL_ID}-pooling.json"

          echo "[model] sanity-checking downloaded assets"
          # Guard against a silent failure returning a tiny HTML error page
          # instead of the real weights (bge-small fp32 model.onnx is ~130 MB).
          onnx_bytes="$(stat -c%s "model/${MODEL_ID}-model.onnx")"
          test "$onnx_bytes" -gt 50000000 \
            || { echo "::error::model.onnx is only ${onnx_bytes} bytes — download likely failed"; exit 1; }
          # last_hidden_state is the output tensor the engine reads; fail loudly
          # if the upstream export ever changes its name so we never ship a model
          # the onnx-local backend can't consume.
          grep -q "last_hidden_state" "model/${MODEL_ID}-model.onnx" \
            || { echo "::error::model.onnx has no last_hidden_state output tensor"; exit 1; }
          test "$(stat -c%s "model/${MODEL_ID}-tokenizer.json")" -gt 100000 \
            || { echo "::error::tokenizer.json looks too small — download likely failed"; exit 1; }

          echo "[model] generating sha256 sidecars"
          cd model
          for f in "${MODEL_ID}-model.onnx" "${MODEL_ID}-tokenizer.json" "${MODEL_ID}-pooling.json"; do
            sha256sum "$f" > "$f.sha256"
            echo "  $(cat "$f.sha256")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cognis-model
          path: model/*

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [dist-binaries, provision-model]
    steps:
      - uses: actions/checkout@v5

      - name: Download platform binaries + model assets
        uses: actions/download-artifact@v4
        with:
          pattern: cognis-*
          path: binaries/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/*
          generate_release_notes: true
