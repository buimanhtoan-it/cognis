name: release

# Tag-driven release. Since the Python engine was removed at K8
# (rust-engine-migration Task 11.2) this builds ONLY the pure-Rust single static
# `cognis` binary per platform (Task 10.1 / G2) — SQLite bundled, no system
# SQLite or Python required (Requirements 8.1, 8.2). The legacy Python
# wheel/sdist, the GHCR Python image, and the PyPI publish jobs are gone.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Per-platform single-binary distribution (Task 10.1). Each entry builds the
  # multi-call `cognis` binary in --release with SQLite bundled and the ONNX
  # embedder backend compiled in (`--features onnx-download`, so ONNX Runtime is
  # statically linked and the binary needs no system ORT), then stages it via
  # `cargo xtask dist` (binary + SHA-256 sidecar). Native runners cover the
  # host-architecture targets; the Linux aarch64 target cross-compiles with
  # `cross` (Docker-backed, no local toolchain).
  #
  # NOTE: the binary carries the embedder *code*; the bge-small model assets
  # (model.onnx / tokenizer.json / pooling.json) are provisioned separately into
  # COGNIS_ONNX_MODEL_DIR (or `assets/models/<leaf>` next to the binary). Without
  # the assets present the semantic leg degrades to empty (lexical + structural
  # still serve) — see docs/distribution.md.
  dist-binaries:
    name: dist · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only the targets ort (2.0-rc.12) publishes a prebuilt ONNX Runtime
        # for — `--features onnx-download` statically links that prebuilt, so a
        # target without one can't produce the self-contained semantic binary.
        # ort has NO prebuilt for x86_64-apple-darwin (Intel Mac) or
        # aarch64-unknown-linux-gnu, so those are intentionally not shipped (the
        # extension's detectTargetTriple advertises only these three and shows a
        # clear "no binary for your platform" message elsewhere). Revisit if ort
        # adds prebuilts or we vendor an ONNX Runtime build for them.
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, cross: false }
          # Pinned to macos-14 (stable Apple-Silicon image). `macos-latest`
          # migrated to macOS 26 whose default toolchain left rustc's linker
          # looking for a clang runtime dir that no longer exists
          # (`ld: library 'clang_rt.osx' not found`). Pinning to the known-good
          # arm64 image plus an explicit Xcode select (below) keeps the native
          # aarch64-apple-darwin link working.
          - { os: macos-14, target: aarch64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    steps:
      - uses: actions/checkout@v4

      # Align the active developer dir with an Xcode actually installed on the
      # runner so `cc`/rustc resolve the clang compiler-rt (`clang_rt.osx`)
      # against a path that exists (fixes the link failure seen when the runner
      # image shipped a different Xcode than rustc assumed).
      - name: Select Xcode (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build + stage (cross)
        if: ${{ matrix.cross }}
        run: cargo xtask dist --use-cross --target ${{ matrix.target }} --features onnx-download

      - name: Build + stage (native)
        if: ${{ !matrix.cross }}
        run: cargo xtask dist --target ${{ matrix.target }} --features onnx-download

      - uses: actions/upload-artifact@v4
        with:
          name: cognis-${{ matrix.target }}
          path: |
            dist/cognis-${{ matrix.target }}*

  # Semantic-model provisioning (Option B, end-to-end automation). The extension
  # downloads the bge-small model assets from THIS release on first semantic use
  # (see apps/cognis-vscode/src/model.ts): model.onnx + tokenizer.json +
  # pooling.json, each checksum-verified against a `.sha256` sidecar. Without
  # these assets a fresh buyer's semantic search silently stays off, so we attach
  # them to every release automatically — no manual upload.
  #
  # Source: the community ONNX export `Xenova/bge-small-en-v1.5` (a BertModel
  # feature-extraction graph: inputs input_ids/attention_mask/token_type_ids,
  # output last_hidden_state[batch,seq,384] — exactly what the onnx-local backend
  # in crates/cognis-embed/src/onnx.rs consumes). Pinned to a specific commit for
  # reproducibility; the sidecars are generated from the bytes we actually
  # download, so verification is self-consistent per release. pooling.json encodes
  # bge's real policy (CLS pooling + L2 normalise).
  provision-model:
    name: provision · semantic model
    runs-on: ubuntu-latest
    env:
      HF_REPO: Xenova/bge-small-en-v1.5
      HF_REV: ea104dacec62c0de699686887e3f920caeb4f3e3
      MODEL_ID: bge-small-en-v1.5
    steps:
      - name: Download + stage model assets
        run: |
          set -euo pipefail
          base="https://huggingface.co/${HF_REPO}/resolve/${HF_REV}"
          mkdir -p model
          echo "[model] downloading model.onnx"
          curl --fail --location --retry 3 --retry-delay 5 \
            -o "model/${MODEL_ID}-model.onnx" "${base}/onnx/model.onnx"
          echo "[model] downloading tokenizer.json"
          curl --fail --location --retry 3 --retry-delay 5 \
            -o "model/${MODEL_ID}-tokenizer.json" "${base}/tokenizer.json"
          echo "[model] writing pooling.json (bge: CLS pooling + L2 normalise)"
          printf '{"pooling":"cls","normalize":true}\n' > "model/${MODEL_ID}-pooling.json"

          echo "[model] sanity-checking downloaded assets"
          # Guard against a silent failure returning a tiny HTML error page
          # instead of the real weights (bge-small fp32 model.onnx is ~130 MB).
          onnx_bytes="$(stat -c%s "model/${MODEL_ID}-model.onnx")"
          test "$onnx_bytes" -gt 50000000 \
            || { echo "::error::model.onnx is only ${onnx_bytes} bytes — download likely failed"; exit 1; }
          # last_hidden_state is the output tensor the engine reads; fail loudly
          # if the upstream export ever changes its name so we never ship a model
          # the onnx-local backend can't consume.
          grep -q "last_hidden_state" "model/${MODEL_ID}-model.onnx" \
            || { echo "::error::model.onnx has no last_hidden_state output tensor"; exit 1; }
          test "$(stat -c%s "model/${MODEL_ID}-tokenizer.json")" -gt 100000 \
            || { echo "::error::tokenizer.json looks too small — download likely failed"; exit 1; }

          echo "[model] generating sha256 sidecars"
          cd model
          for f in "${MODEL_ID}-model.onnx" "${MODEL_ID}-tokenizer.json" "${MODEL_ID}-pooling.json"; do
            sha256sum "$f" > "$f.sha256"
            echo "  $(cat "$f.sha256")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cognis-model
          path: model/*

  # End-to-end semantic smoke test on the REAL shipped artifact (the thing a
  # buyer downloads): the freshly-built self-contained Linux binary + the
  # provisioned bge-small model. Proves the whole semantic path actually returns
  # correct results — engine binary runs with no external deps, loads the model,
  # produces embeddings, and `semantic_search` over MCP ranks the right symbol
  # top. Gates the release: a broken semantic pipeline blocks publishing.
  semantic-smoke:
    name: smoke · semantic (shipped linux binary)
    runs-on: ubuntu-latest
    needs: [dist-binaries, provision-model]
    steps:
      - name: Fetch shipped binary + model artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cognis-*
          path: art/
          merge-multiple: true

      - name: Run a real semantic query against the shipped binary
        run: |
          set -euo pipefail
          bin="art/cognis-x86_64-unknown-linux-gnu"
          chmod +x "$bin"

          echo "== binary is self-contained (no external ONNX Runtime) =="
          "$bin" --version

          # Arrange the model dir the way the extension does (plain leaf names).
          mkdir -p model repo
          cp art/bge-small-en-v1.5-model.onnx      model/model.onnx
          cp art/bge-small-en-v1.5-tokenizer.json  model/tokenizer.json
          cp art/bge-small-en-v1.5-pooling.json    model/pooling.json

          # A tiny fixture repo with a semantically-distinctive function
          # (printf, not heredoc — robust to YAML block-scalar indentation).
          printf 'import time\ndef retry_http_request(url, max_attempts=3, backoff=0.5):\n    """Send an HTTP GET and retry on transient network failure with exponential backoff."""\n    return _send(url)\ndef _send(url):\n    raise ConnectionError("network down")\n' > repo/net.py
          printf 'import json\ndef to_json(obj):\n    """Serialize a Python object into a compact JSON string."""\n    return json.dumps(obj, sort_keys=True)\n' > repo/serialize.py

          echo "== index with real embeddings =="
          COGNIS_ONNX_MODEL_DIR="$PWD/model" "$bin" cli --repo-root repo bootstrap | tee boot.log
          grep -q "symbol vectors present" boot.log \
            || { echo "::error::no embeddings produced — semantic pipeline broken"; exit 1; }

          echo "== semantic_search over MCP (stdio) =="
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"semantic_search","arguments":{"query":"retry a failed network request with exponential backoff","k":3}}}'
          } | COGNIS_DB_PATH="$PWD/repo/.cognis/uckg.db" COGNIS_ONNX_MODEL_DIR="$PWD/model" \
                timeout 90 "$bin" mcpd > mcp_out.jsonl 2>/dev/null || true
          echo "---- mcp response ----"; cat mcp_out.jsonl

          grep -q "retry_http_request" mcp_out.jsonl \
            || { echo "::error::semantic_search did not return the expected symbol"; exit 1; }
          echo "== semantic smoke PASSED =="

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [dist-binaries, provision-model, semantic-smoke]
    steps:
      - uses: actions/checkout@v5

      - name: Download platform binaries + model assets
        uses: actions/download-artifact@v4
        with:
          pattern: cognis-*
          path: binaries/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            binaries/*
          generate_release_notes: true
