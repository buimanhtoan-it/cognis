[package]
name = "cognis-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cognis store: UCKG access (rusqlite + FTS5 + sqlite-vec), CSR builder."

[features]
# sqlite-vec KNN acceleration is OFF by default so the engine builds and tests
# run fully offline with no extension present — the BLOB linear-scan fallback
# (Requirement 2.4) is what default `cargo test` exercises. Enabling this links
# the bundled sqlite-vec module into the process and keeps the explicit
# `COGNIS_SQLITE_VEC_PATH` loadable-extension escape hatch available.
default = []
sqlite-vec = ["dep:sqlite-vec", "rusqlite/load_extension"]

[dependencies]
cognis-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Bundled SQLite (Requirement 8.2: no system SQLite). FTS5 is compiled in so the
# Python-built `symbol_fts` virtual table opens unchanged.
rusqlite = { workspace = true, features = ["bundled"] }
sqlite-vec = { version = "0.1.9", optional = true }

[dev-dependencies]
tempfile = "3"
proptest.workspace = true
# Shared property-test generators (cognis-one-toggle-engine task 2.1). Dev-only:
# nothing in the shipped binary links against it.
cognis-testgen.workspace = true
# `tests/migration_smoke.rs` (task 1.5) hashes the frozen `001_initial.sql` to
# pin it against a committed baseline.
sha2.workspace = true
# Same bundled SQLite the crate itself links, so `tests/migration_smoke.rs` can
# build an authentic schema-version-1 (pre-feature) database by applying ONLY
# `001_initial.sql` — `Database::connect` always migrates, so the un-migrated
# state is only reachable through a raw connection.
rusqlite = { workspace = true, features = ["bundled"] }
