# cognis self-hosted v1 — supported production stack
#
# Usage (from repo root):
#   docker compose -f deploy/compose.yaml up -d
#   docker compose -f deploy/compose.yaml exec mcpd cognis-cli health
#
# Mount your codebase at ./workspace (or set WORKSPACE_HOST_PATH).

services:
  mcpd:
    image: ghcr.io/buimanhtoan-it/cognis-engine:0.3.0
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["cognis-mcpd"]
    environment:
      COGNIS_DB_PATH: /workspace/.cognis/uckg.db
      COGNIS_AUDIT_LOG: /workspace/.cognis/audit.log
      COGNIS_LOG_LEVEL: INFO
    volumes:
      - ${WORKSPACE_HOST_PATH:-./workspace}:/workspace:rw
    working_dir: /workspace
    stdin_open: true
    tty: false
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "cognis.cli.main",
          "health",
          "--json",
        ]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

  indexd:
    image: ghcr.io/buimanhtoan-it/cognis-engine:0.3.0
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      [
        "cognis-indexd",
        "--repo-root",
        "/workspace",
      ]
    environment:
      COGNIS_DB_PATH: /workspace/.cognis/uckg.db
      COGNIS_LOG_LEVEL: INFO
    volumes:
      - ${WORKSPACE_HOST_PATH:-./workspace}:/workspace:rw
    working_dir: /workspace
    restart: unless-stopped
    depends_on:
      mcpd:
        condition: service_started
