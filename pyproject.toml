[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "cognis-engine"
version = "0.6.0"
description = "Software Cognition Engine — MCP-native context capsules for LLM coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "cognis maintainers" }]
keywords = ["mcp", "code-search", "code-graph", "rag", "llm", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

# Runtime deps stay intentionally light at task-1 bootstrap. Concrete deps land
# alongside the modules that need them (parser, embedder, MCP server, ...).
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Per-feature extras land as later tasks need them. Keeping the surface
# explicit forces every new dep to justify itself in docs/deps.md.
indexer = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "watchdog>=4.0",
]
embed-local = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
vector = [
    # sqlite-vec ships a Python wrapper; install instructions live in README.
    "sqlite-vec>=0.1.6",
]
mcp = [
    "fastmcp>=0.3",
]
tokenizers = [
    "tiktoken>=0.7",
]

[project.scripts]
cognis-cli    = "cognis.cli.main:main"
cognis-mcpd   = "cognis_mcpd.main:main"
cognis-indexd = "cognis_indexd.main:main"

[project.urls]
Homepage   = "https://github.com/buimanhtoan-it/cognis"
Issues     = "https://github.com/buimanhtoan-it/cognis/issues"
Changelog  = "https://github.com/buimanhtoan-it/cognis/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — used by `pip install --group dev`, `uv sync`,
# and the Makefile/tasks.py recipes. Pinned tools per Task 1.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.108",
    "pre-commit>=3.7",
    "invoke>=2.2",
    "coverage[toml]>=7.6",
]

# ---------------------------------------------------------------------------
# Hatch build configuration — package layout per design.md "Build and Release"
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = [
    "packages/core/cognis",
    "packages/retrieval/cognis_retrieval",
    "packages/indexer/cognis_indexer",
    "packages/adapters/cognis_adapters",
    "packages/eval/cognis_eval",
    "apps/cognis-cli/cognis_cli",
    "apps/cognis-mcpd/cognis_mcpd",
    "apps/cognis-indexd/cognis_indexd",
]

[tool.hatch.build.targets.wheel.force-include]
"packages/core/cognis/assets/logo.png" = "cognis/assets/logo.png"

[tool.hatch.build.targets.sdist]
include = [
    "/apps",
    "/assets",
    "/packages",
    "/deploy",
    "/eval-baselines",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/Makefile",
    "/tasks.py",
]

# ---------------------------------------------------------------------------
# Tooling: ruff (format + lint)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".cognis",
    "build",
    "dist",
    "tests/fixtures/repos",
]

[tool.ruff.lint]
# Conservative starter set. Tighten in later phases as conventions settle.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Tooling: mypy
# Strict enforcement scoped to packages/core per Task 1. Other packages get
# permissive defaults until they stabilize, then move into the strict list.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = [
    "packages/core",
    "packages/retrieval",
    "packages/indexer",
    "packages/adapters",
    "packages/eval",
    "apps/cognis-cli",
    "apps/cognis-mcpd",
    "apps/cognis-indexd",
]
files = ["packages", "apps", "tests"]
exclude = [
    "tests/fixtures/repos/",
    "build/",
    "dist/",
]
# Note: warn_unused_configs flags overrides for not-yet-imported libs as
# unused; we keep the overrides because they activate as soon as the
# corresponding extras are installed. Re-enable the flag once Phase 1 has all
# extras pulled into CI.
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "cognis.*"
strict = true

[[tool.mypy.overrides]]
module = "cognis_eval.*"
strict = true

[[tool.mypy.overrides]]
module = "cognis_indexer.*"
strict = true

[[tool.mypy.overrides]]
module = "cognis_retrieval.*"
strict = true

[[tool.mypy.overrides]]
# Third-party libs without complete stubs at MVP.
module = [
    "tree_sitter.*",
    "sqlite_vec.*",
    "sentence_transformers.*",
    "fastmcp.*",
    "watchdog.*",
    # Optional upstream MCP conformance harness; imported lazily behind a
    # find_spec guard in cognis-cli, not a hard dependency.
    "mcp_conformance.*",
    "tiktoken.*",
    # PyYAML ships no inline types and CI does not install types-PyYAML;
    # treat it as untyped so `make typecheck` does not require the stub pkg.
    "yaml",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tooling: pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: fast in-process tests (default).",
    "integration: cross-process or fixture-repo tests.",
    "e2e: full cross-app flow over real process boundaries (CLI + indexd + mcpd).",
    "eval: slow eval-harness tests, run nightly.",
    "pbt: hypothesis property-based tests (CP-1..CP-12 in design.md).",
    "benchmark: pytest-benchmark performance assertions.",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:hypothesis.*",
    # Third-party noise: opentelemetry (pulled in by fastmcp) calls the
    # deprecated importlib.metadata SelectableGroups dict interface on import.
    # Not our code and not actionable here; don't let it fail the MCP e2e suite.
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Tooling: coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
# parallel + a COVERAGE_PROCESS_START bootstrap (tests/coverage/sitecustomize.py)
# let us measure code that runs inside the *subprocesses* the e2e harness spawns
# (cognis-cli / cognis-indexd / cognis-mcpd), not just the in-process test code.
# Each process writes its own .coverage.<host>.<pid>.<rand>; `coverage combine`
# merges them. ``sigterm`` flushes data when a daemon is stopped via SIGTERM
# (POSIX CI); on Windows ``terminate()`` is a hard kill that cannot flush, so
# daemon-subprocess lines there are covered by the in-process daemon tests
# instead (see tests/coverage/README.md).
parallel = true
sigterm = true
concurrency = ["thread"]
source = [
    "packages/core",
    "packages/retrieval",
    "packages/indexer",
    "packages/adapters",
    "packages/eval",
    "apps",
]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.paths]
# Collapse the same file seen from different cwds / install layouts into one
# logical path so `coverage combine` merges subprocess + in-process data.
core       = ["packages/core/cognis", "*/packages/core/cognis", "*/cognis"]
retrieval  = ["packages/retrieval/cognis_retrieval", "*/cognis_retrieval"]
indexer    = ["packages/indexer/cognis_indexer", "*/cognis_indexer"]
adapters   = ["packages/adapters/cognis_adapters", "*/cognis_adapters"]
eval       = ["packages/eval/cognis_eval", "*/cognis_eval"]
apps       = ["apps", "*/apps"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60  # production CI gate; raise as coverage grows.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
