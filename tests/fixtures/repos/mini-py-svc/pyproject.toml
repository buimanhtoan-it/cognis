# mini-py-svc — cognis test fixture
#
# Declares the dependency surface the parser/enricher should observe but is
# NOT installed in CI. The cognis test suite reads this file as a manifest,
# never as a buildable project.
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mini-py-svc"
version = "0.1.0"
description = "Cognis fixture: minimal FastAPI + SQLAlchemy service with planted secret-shaped strings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cognis maintainers" }]
keywords = ["fixture", "fastapi", "sqlalchemy", "cognis-test"]

# Runtime deps as declared — the indexer should observe these names. They
# are deliberately NOT installed by CI; this fixture is parsed, not run.
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "passlib>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mini-py-svc = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/db", "src/api", "src/utils"]

[tool.ruff]
line-length = 100
target-version = "py311"
